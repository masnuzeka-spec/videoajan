name: Video uret
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install edge-tts requests numpy
      - run: python make_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            video.mp4
            aciklama.txt
      - run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add sira.txt
          git commit -m "sira guncelle" || true
          git push
